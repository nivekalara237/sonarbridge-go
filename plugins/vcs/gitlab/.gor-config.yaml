# goreleaser config for ci-bridge-vcs-gitlab. Produces the exact
# artifact naming + checksums.txt convention registry.GitHubRegistry
# expects: <project>_<GOOS>_<GOARCH>, a top-level checksums.txt, both
# attached to the GitHub Release created for the pushed tag.

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
version: 2

project_name: ci-bridge-vcs-gitlab
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
dist: ./bin.local/assets/binaries/gitlab
report_sizes: false
env:
  - VERSION="{{ .Version }}"
  - IGNORE_TAG=latest
  - VCS_PATH=./plugins/vcs/gitlab
  - VCS_PKG=sonarbridge-go/plugins/vcs
  - GITLAB_PROTOCOL_VERSION="1"
retry:
  attempts: 2
  delay: 5s
  max_delay: 3m
git:
  ignore_tags:
    - nightly
    - "*-snapshot"
    - "*-local"
    - "*-dev"
    - "{{ .Env.IGNORE_TAG }}"

checksum:
#  name_template: "{{ .ProjectName }}-{{ .ArtifactName }}.{{ .Algorithm }}_checksums.txt"
  name_template: "{{ .ProjectName }}_checksums.txt"
  split: false
  algorithm: sha256

before:
  hooks:
    # - make clean
    # - go mod tidy
    - make tidy
    # you may remove this if you don't need "go generate"
    - go generate ./...

builds:
  - id: gitlab
    main: ./cmd
    binary: ci-bridge-vcs-gitlab
    command: build
    builder: go
    ldflags:
      - -s -w -X {{ .Env.VCS_PKG }}/build.Version={{ .Version }} -X {{ .Env.VCS_PKG }}/build.ProtocolVersion={{ .Env.GITLAB_PROTOCOL_VERSION }} -X {{ .Env.VCS_PKG }}/build.Date={{ .Now.Format "2006-01-02T15:04:05.12340" }}
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    goamd64: [v2]
    tool: "go1.27.1"
    no_unique_dist_dir: false
    dir: "plugins/vcs/gitlab"

archives:
  # No .tar.gz/.zip wrapping — registry.GitHubRegistry downloads the
  # executable directly by its exact asset name. format: binary skips
  # archiving and just uploads the raw binary as the release asset.
  - formats: [binary]
    id: vcs-gitlab-plugin-archive
#    wrap_in_directory: true
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  disable: true

release:
  disable: true
  footer: >-
    
    # Version Control System Bridge Plugin - Gitlab
        
    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
